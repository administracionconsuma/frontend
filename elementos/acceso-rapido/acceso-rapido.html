<button
    class="acceso-rapido"
    type="button"
    data-acceso-rapido
>
    <span
        class="acceso-rapido__icono"
        data-acceso-rapido-icono
        aria-hidden="true"
    ></span>

    <span class="acceso-rapido__contenido">
        <strong
            class="acceso-rapido__titulo"
            data-acceso-rapido-titulo
        ></strong>

        <span
            class="acceso-rapido__descripcion"
            data-acceso-rapido-descripcion
        ></span>
    </span>

    <span
        class="acceso-rapido__indicador"
        aria-hidden="true"
    >
        ›
    </span>
</button>
