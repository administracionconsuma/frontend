<div
    class="modal-crear-insumo"
    data-modal-crear-insumo
    hidden
>
    <div
        class="modal-crear-insumo__fondo"
        data-modal-crear-insumo-fondo
    ></div>

    <section
        class="modal-crear-insumo__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-crear-insumo-titulo"
        tabindex="-1"
        data-modal-crear-insumo-panel
    >
        <div
            class="modal-crear-insumo__vista"
            data-modal-crear-insumo-vista-formulario
        >
            <header class="modal-crear-insumo__encabezado">
                <div class="modal-crear-insumo__encabezado-textos">
                    <span
                        class="modal-crear-insumo__etiqueta"
                        data-modal-crear-insumo-etiqueta
                    ></span>

                    <h2
                        class="modal-crear-insumo__titulo"
                        id="modal-crear-insumo-titulo"
                        data-modal-crear-insumo-titulo
                    ></h2>
                </div>

                <button
                    class="modal-crear-insumo__cerrar"
                    type="button"
                    data-modal-crear-insumo-cerrar
                >
                    <span aria-hidden="true">×</span>
                </button>
            </header>

            <form
                class="modal-crear-insumo__formulario"
                data-modal-crear-insumo-formulario
            >
                <label class="modal-crear-insumo__campo">
                    <span
                        class="modal-crear-insumo__campo-etiqueta"
                        data-modal-crear-insumo-campo-nombre-etiqueta
                    ></span>

                    <input
                        class="modal-crear-insumo__campo-control"
                        type="text"
                        name="nombre"
                        autocomplete="off"
                        required
                        data-modal-crear-insumo-campo-nombre
                    >
                </label>

                <p
                    class="modal-crear-insumo__mensaje"
                    data-modal-crear-insumo-mensaje
                    hidden
                ></p>

                <footer class="modal-crear-insumo__acciones">
                    <button
                        class="modal-crear-insumo__boton modal-crear-insumo__boton--secundario"
                        type="button"
                        data-modal-crear-insumo-cancelar
                    ></button>

                    <button
                        class="modal-crear-insumo__boton modal-crear-insumo__boton--principal"
                        type="submit"
                        data-modal-crear-insumo-guardar
                    ></button>
                </footer>
            </form>
        </div>

        <div
            class="modal-crear-insumo__exito"
            data-modal-crear-insumo-vista-exito
            hidden
        >
            <div
                class="modal-crear-insumo__exito-icono"
                aria-hidden="true"
            >
                ✓
            </div>

            <h2
                class="modal-crear-insumo__exito-titulo"
                data-modal-crear-insumo-exito-titulo
            ></h2>

            <p
                class="modal-crear-insumo__exito-texto"
                data-modal-crear-insumo-exito-texto
            ></p>

            <button
                class="modal-crear-insumo__boton modal-crear-insumo__boton--principal"
                type="button"
                data-modal-crear-insumo-exito-cerrar
            ></button>
        </div>
    </section>
</div>
