<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrativo | Consuma</title>
    <link rel="stylesheet" href="./base.css">
</head>
<body>
    <main class="acceso-administrativo">
        <section class="acceso-contenedor" aria-labelledby="titulo-acceso">
            <img
                class="acceso-logo"
                src="../recursos/dominio/logo.png"
                alt="Consuma"
            >

            <div class="acceso-contenido">
                <p class="acceso-etiqueta">Administración</p>

                <h1 id="titulo-acceso" class="acceso-titulo">
                    Ingresar al panel
                </h1>

                <p class="acceso-descripcion">
                    Accedé con tu usuario administrador.
                </p>

                <form id="formulario-acceso" class="acceso-formulario" novalidate>
                    <div class="acceso-campo">
                        <label for="correo">Correo electrónico</label>
                        <input
                            id="correo"
                            name="correo"
                            type="email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="acceso-campo">
                        <label for="password">Contraseña</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <p
                        id="mensaje-acceso"
                        class="acceso-mensaje"
                        role="alert"
                        aria-live="polite"
                    ></p>

                    <button id="boton-acceso" class="acceso-boton" type="submit">
                        Ingresar
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="./principal.js"></script>
</body>
</html>
